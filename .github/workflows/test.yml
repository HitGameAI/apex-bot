name: Test

# Go 库的编译、静态分析与测试由组织工作流统一维护。

on:
  push:
    branches:
      - master
      - main
      - fork-stable
      - refactor/fork-stable
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    uses: HitGameAI/deploy-pipeline/.github/workflows/go-library-test.yml@fe59068c93c25b65ce4b9db6e8e5d801533e7d27
    with:
      platforms: '["ubuntu-latest"]'
      test-flags: "-short -race -mod=readonly"
      coverage-upload: false
